<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maria Uys — Designer &amp; Artist</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="home">
  <div id="overlay" onclick="toggleMenu(event)"></div>
  <div class="topbar">
    <button class="hamburger" type="button" aria-label="Open menu">&#9776;</button>
    <div class="logo"><a href="/index.html">MU</a></div>
  </div>
  <nav id="mobileMenu" class="slideout">
    <button class="close-btn" type="button" aria-label="Close menu">×</button>
    <ul>
      <li><a href="/index.html">About</a></li>
      <li class="portfolio-toggle" onclick="toggleDropdown(this)">
        <a href="#">Portfolio <span class="arrow">&#9662;</span></a>
        <ul class="portfolio-sub">
          <li><a href="/brand-identity.html">&bull; Brand Identity</a></li>
          <li><a href="/graphic-design.html">&bull; Graphic Design</a></li>
          <li><a href="/illustration.html">&bull; Illustration</a></li>
          <li><a href="/packaging-design.html">&bull; Packaging</a></li>
          <li><a href="/stylist.html">&bull; Stylist</a></li>
          <li><a href="/textile-design.html">&bull; Textile</a></li>
        </ul>
      </li>
      <li><a href="/features.html">Features</a></li>
      <li><a href="/contact.html">Contact</a></li>
      <li><a href="/cv.html" class="cv-label">CV</a></li>
    </ul>
  </nav>

  <main id="scrollContainer">
    <section class="opener">
      <div class="hero-bg"></div>
      <button id="enter" class="btn">Enter</button>
    </section>

    <section class="chapter" id="chapter-brand">
      <h2>Brand Identity</h2>
      <div class="gallery">
        <img src="portfolio/brand-identity/images/img3.jpg" alt="Brand Identity sample" class="lightbox-trigger">
      </div>
    </section>

    <section class="chapter" id="chapter-graphic">
      <h2>Graphic Design</h2>
      <div class="gallery">
        <img src="portfolio/graphic-design/images/img2.jpg" alt="Graphic Design sample" class="lightbox-trigger">
      </div>
    </section>

    <section class="chapter" id="chapter-illustration">
      <h2>Illustration</h2>
      <div class="gallery">
        <img src="portfolio/illustration/images/img1.jpg" alt="Illustration sample" class="lightbox-trigger">
      </div>
    </section>
  </main>

  <div id="lightbox">
    <button class="close-btn-lightbox" type="button" aria-label="Close gallery">×</button>
    <button class="nav-btn nav-left" type="button" aria-label="Previous image">‹</button>
    <canvas id="lightboxCanvas"></canvas>
    <button class="nav-btn nav-right" type="button" aria-label="Next image">›</button>
  </div>

  <footer class="social-footer">
    <a href="https://www.instagram.com/mariameraai/" target="_blank" rel="noopener noreferrer">
      <img src="/instagram-logo.svg" alt="Instagram">
    </a>
    <p class="credit">built by CheekyBuild</p>
    <a href="/admin/" class="visually-hidden">Admin</a>
  </footer>

  <script src="/main.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
