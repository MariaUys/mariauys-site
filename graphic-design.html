<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphic Design | Maria Uys</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="graphic-design" oncontextmenu="return false;">
  <!-- overlay + topbar/nav (global) -->
  <div id="overlay" onclick="toggleMenu(event)"></div>
  <div class="topbar">
    <div class="hamburger" onclick="toggleMenu(event)">&#9776;</div>
    <div class="logo"><a href="index.html">MU</a></div>
  </div>
  <nav id="mobileMenu" class="slideout">
    <div class="close-btn" onclick="toggleMenu()">×</div>
    <ul>
      <li><a href="index.html">About</a></li>
      <li class="portfolio-toggle" onclick="toggleDropdown(this)">
        <a href="#">Portfolio <span class="arrow">&#9662;</span></a>
        <ul class="portfolio-sub">
          <li><a href="brand-identity.html">&bull; Brand Identity</a></li>
          <li><a href="graphic-design.html">&bull; Graphic Design</a></li>
          <li><a href="illustration.html">&bull; Illustration</a></li>
          <li><a href="packaging-design.html">&bull; Packaging</a></li>
          <li><a href="stylist.html">&bull; Stylist</a></li>
          <li><a href="textile-design.html">&bull; Textile</a></li>
        </ul>
      </li>
      <li><a href="afrigarde.html">Afrigarde</a></li>
      <li><a href="cv.html" class="cv-label"></a></li>
      <li><a href="art.html">Art</a></li>
    </ul>
  </nav>

  <main>
  <h1>Graphic Design</h1>

  <!-- 1) looping GIF -->
  <div class="graphic-gif">
    <img src="portfolio/graphic-design/images/img1.gif" alt="Graphic design animation">
  </div>

  <!-- 2) centered bold subtitle -->
  <div class="graphic-title">
    <p>Logo Design.</p>
  </div>

  <!-- 3-up row #1 (2–4) -->
  <section class="graphic-gallery three-up">
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img2.jpg"  data-src="portfolio/graphic-design/images/img2.jpg"  alt="Design 1">
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img3.jpg"  data-src="portfolio/graphic-design/images/img3.jpg"  alt="Design 2">
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img4.jpg"  data-src="portfolio/graphic-design/images/img4.jpg"  alt="Design 3">
  </section>
  <hr>

  <!-- 3-up row #2 (5–7) -->
  <section class="graphic-gallery three-up">
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img5.jpg"  data-src="portfolio/graphic-design/images/img5.jpg"  alt="Design 4">
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img6.jpg"  data-src="portfolio/graphic-design/images/img6.jpg"  alt="Design 5">
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img7.jpg"  data-src="portfolio/graphic-design/images/img7.jpg"  alt="Design 6">
  </section>
  <hr>

  <!-- 3-up row #3 (8–10) -->
  <section class="graphic-gallery three-up">
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img8.jpg"  data-src="portfolio/graphic-design/images/img8.jpg"  alt="Design 7">
    <!-- img9 sometimes png on disk → add fallback -->
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img9.jpg"  data-src="portfolio/graphic-design/images/img9.jpg"  alt="Design 8" onerror="this.onerror=null;this.src='portfolio/graphic-design/images/img9.png';this.dataset.src='portfolio/graphic-design/images/img9.png'">
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img10.png" data-src="portfolio/graphic-design/images/img10.png" alt="Design 9">
  </section>
  <hr>

  <!-- 2-up row (11–12; 12 sometimes png) -->
  <section class="graphic-gallery two-up">
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img11.jpg" data-src="portfolio/graphic-design/images/img11.jpg" alt="Design 10" onerror="this.onerror=null;this.src='portfolio/graphic-design/images/img11.png';this.dataset.src='portfolio/graphic-design/images/img11.png'">
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img12.jpg" data-src="portfolio/graphic-design/images/img12.jpg" alt="Design 11" onerror="this.onerror=null;this.src='portfolio/graphic-design/images/img12.png';this.dataset.src='portfolio/graphic-design/images/img12.png'">
  </section>
  <hr>

  <!-- final 3-up row (13–15; 14 often png) -->
  <section class="graphic-gallery three-up">
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img13.jpg" data-src="portfolio/graphic-design/images/img13.jpg" alt="Design 12" onerror="this.onerror=null;this.src='portfolio/graphic-design/images/img13.png';this.dataset.src='portfolio/graphic-design/images/img13.png'">
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img14.png" data-src="portfolio/graphic-design/images/img14.png" alt="Design 13" onerror="this.onerror=null;this.src='portfolio/graphic-design/images/img14.png';this.dataset.src='portfolio/graphic-design/images/img14.png'">
    <img class="lightbox-trigger" src="portfolio/graphic-design/images/img15.png" data-src="portfolio/graphic-design/images/img15.png" alt="Design 14">
  </section>
</main>

  <!-- shared lightbox container -->
  <div id="lightbox">
    <div class="close-btn-lightbox">×</div>
    <div class="nav-btn nav-left">‹</div>
    <canvas id="lightboxCanvas"></canvas>
    <div class="nav-btn nav-right">›</div>
  </div>

  <!-- global + page-specific scripts -->
  <script src="script.js" defer></script>
  <script defer>
    // initialize Image triggers for this page
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.lightbox-trigger').forEach(img => {
        img.addEventListener('click', () => {
          openLightboxFromPath(img.dataset.src);
        });
      });
    });
  </script>
</body>
</html>
